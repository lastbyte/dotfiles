# ==========================================
# 🔌 PLUGINS & EXTENSIONS
# ==========================================
# TPM Plugin Management
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'janoamaral/tokyo-night-tmux'

# Tmux-Yank Configuration
set -g @yank_action 'copy-pipe'

# Tokyo Night Theme Customization
set -g @tokyo-night-tmux_path_format 'relative'
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_show_git 0
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_window_id_style 'dsquare'

# ==========================================
# ⚙️ GENERAL SETTINGS
# ==========================================
set -g default-shell /bin/zsh
set -g history-limit 2000
set -g mouse on

# Window and Pane Indexing (Start at 1 instead of 0)
set -g base-index 1
set -w -g pane-base-index 1
set -g renumber-windows on

# Key Bindings & Inputs
set -g prefix C-b
set -g status-keys vi
set -g assume-paste-time 1
set -g repeat-time 1000

# ==========================================
# 🎨 UI, STATUS BAR, & COSMETICS
# ==========================================
set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 15

# Color Profiles
set -g status-style "bg=#262626,fg=#ffffff"
set -g message-style "bg=yellow,fg=black"
set -g message-command-style "bg=black,fg=yellow"
set -g display-panes-active-colour red
set -g display-panes-colour blue
set -g display-panes-time 1000
set -g display-time 750

# Status Bar Text Templates
set -g status-left "[#{session_name}] "
set -g status-left-length 10
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" %H:%M %d-%b-%y"
set -g status-right-length 40

# ==========================================
# 🚀 INITIALIZE PLUGIN MANAGER
# ==========================================
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'

